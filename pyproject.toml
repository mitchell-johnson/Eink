[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eink-ble"
version = "0.1.0"
description = "Direct, local Bluetooth image control for WoLink e-ink labels"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["bleak>=3.0,<4", "Pillow>=10.1", "cryptography>=42"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
eink-ble = "eink_ble.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/eink_ble"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/eink_ble/*.py",
    "/tests/*.py",
    "/examples/*.py",
    "/README.md",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
